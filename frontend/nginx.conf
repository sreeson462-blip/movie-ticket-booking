server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API (including the SSE stream) goes to the backend container; no buffering so live updates arrive instantly.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # React Router: any other URL serves the app shell.
  location / {
    try_files $uri /index.html;
  }
}
